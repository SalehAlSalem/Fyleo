<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/fyleo-logo.svg" />
    <link rel="apple-touch-icon" href="/fyleo-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Safari iOS PWA compatibility - Show status bar -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Fyleo" />
    
    <title>Fyleo - مشاركة الملفات التعليمية</title>
    <meta name="description" content="منصة Fyleo لمشاركة وتنظيم الملفات التعليمية والأكاديمية" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Dynamic RTL/LTR styling based on language -->
    <style>
      /* RTL styling for Arabic */
      html[dir="rtl"], html[dir="rtl"] body {
        direction: rtl;
        text-align: right;
      }
      
      /* LTR styling for English */
      html[dir="ltr"], html[dir="ltr"] body {
        direction: ltr;
        text-align: left;
      }
      
      /* Prevent scroll restoration */
      html {
        scroll-behavior: auto !important;
      }
      /* Prevent iOS zoom on input focus - minimum 16px font size */
      input, textarea, select {
        font-size: 16px !important;
      }
      /* iOS PWA Safe Area Insets - Prevent content from overlapping status bar and home indicator */
      body {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
    </style>
    
    <!-- Prevent browser scroll restoration -->
    <script>
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }
    </script>
    
    <!-- PDF.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <!-- GitHub Pages SPA support -->
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body>
   <div id="root"></div>
   <div id="modal" class="top-0 z-[1000000] absolute"></div>
   <script type="module" src="/src/app/main.jsx"></script>
  </body>
</html>
